name: Upload approved GTA VI MP4 privately

on:
  workflow_dispatch:
    inputs:
      title:
        description: Verified gameplay video title (not countdown/GTA Online)
        required: true
        default: GTA VI gameplay highlight #Shorts
      start_seconds:
        description: Start time in the approved MP4 (seconds)
        required: true
        default: '0'

permissions:
  contents: write

concurrency:
  group: worldwide-highlight-scanner
  cancel-in-progress: false

jobs:
  upload-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
      APPROVED_GTA6_MP4_URL: ${{ secrets.APPROVED_GTA6_MP4_URL }}
      APPROVED_UPLOAD_TITLE: ${{ inputs.title }}
      APPROVED_UPLOAD_START: ${{ inputs.start_seconds }}
      STATE_PATH: state/processed.json
      APPROVED_UPLOAD_REPORT: reports/approved_upload_latest.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify FFmpeg
        run: ffmpeg -version | head -n 1
      - name: Render and privately upload approved MP4
        run: python -m scripts.upload_approved_mp4
      - name: Persist UTC hour reservation and sanitized upload report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/processed.json reports/approved_upload_latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record private approved MP4 upload result'
            git push
          fi
      - name: Verify actual YouTube publication
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('reports/approved_upload_latest.json')
          if not path.exists():
              raise SystemExit('Missing upload report: no publication confirmed')
          r = json.loads(path.read_text(encoding='utf8'))
          print('Upload result:', r.get('status'))
          if r.get('youtube_url'):
              print('Private video URL:', r['youtube_url'])
          if r.get('status') != 'published_private':
              raise SystemExit('YouTube did not confirm an upload; inspect approved_upload_latest.json')
          PY
