name: Hourly worldwide highlight scanner

on:
  schedule:
    # Every hour at minute 07 UTC; GitHub may delay or drop scheduled runs.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldwide-highlight-scanner
  cancel-in-progress: false

jobs:
  discover-and-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      INSTAGRAM_PAGE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_PAGE_ACCESS_TOKEN }}
      INSTAGRAM_AUTO_UPLOAD: ${{ vars.INSTAGRAM_AUTO_UPLOAD || 'false' }}
      INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION || 'v26.0' }}
      MEDIA_SOURCE_MAP_JSON: ${{ secrets.MEDIA_SOURCE_MAP_JSON }}
      SOURCE_MODE: ${{ vars.SOURCE_MODE || 'yt_dlp' }}
      LIVE_SEARCH_TERM: ${{ vars.LIVE_SEARCH_TERM || 'GTA 6 gameplay live' }}
      LIVE_CAPTURE_ENABLED: ${{ vars.LIVE_CAPTURE_ENABLED || 'true' }}
      LIVE_CAPTURE_SECONDS: ${{ vars.LIVE_CAPTURE_SECONDS || '150' }}
      MAX_LIVE_CAPTURES_PER_RUN: ${{ vars.MAX_LIVE_CAPTURES_PER_RUN || '1' }}
      LIVE_POLLS: ${{ vars.LIVE_POLLS || '6' }}
      LIVE_CLOCK_SHIFT_SECONDS: ${{ vars.LIVE_CLOCK_SHIFT_SECONDS || '0' }}
      TARGET_CLIPS_PER_VIDEO: ${{ vars.TARGET_CLIPS_PER_VIDEO || '8' }}
      MAX_CLIPS_PER_VIDEO: ${{ vars.MAX_CLIPS_PER_VIDEO || '9' }}
      CLIP_LEAD_SECONDS: '20'
      CLIP_AFTER_SECONDS: '10'
      # Explicitly enabled for scheduled YouTube posting (one attempt per UTC hour).
      # First live publishing test is private; change to false to pause automation.
      AUTO_UPLOAD: 'true'
      UPLOAD_PRIVACY: 'private' # first successful upload must be reviewed before public posting
      SEARCH_TERMS: ${{ vars.SEARCH_TERMS || 'GTA 6 gameplay live,GTA VI gameplay long,GTA 6 gameplay shorts' }}
      REGION_CODES: ${{ vars.REGION_CODES || 'US,IN,GB,JP,BR' }}
      FREE_MODEL_CANDIDATES: ${{ vars.FREE_MODEL_CANDIDATES || 'gemini-2.5-flash-lite,gemini-2.5-flash,gemini-3-flash-preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify FFmpeg
        run: ffmpeg -version | head -n 1
      - name: Clear last run report (avoid showing stale data after failure)
        run: rm -f reports/latest.json
      - name: Scan live GTA 6 first, then VOD and Shorts
        run: python -m app.main
      - name: Explain scan outcome
        if: always()
        run: python scripts/print_scan_summary.py
      - name: Persist dedup state and public metadata report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/processed.json reports/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update hourly highlight metadata'
            git push
          fi
