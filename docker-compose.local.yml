# This overlay makes GTAClipper use only local AI (Docker Desktop on Windows 11).
# Use with: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  ollama-setup:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull qwen2.5:3b
        ollama pull qwen2.5:1.5b
    restart: "no"

  backend:
    environment:
      LLM: ollama:qwen2.5:3b
      RERANK_LLM: ollama:qwen2.5:3b
      OLLAMA_BASE_URL: http://ollama:11434/v1
      TRANSCRIPTION_PROVIDER: whisper
      WHISPER_MODEL_SIZE: base
      WHISPER_FALLBACK_MODEL: tiny
      LOCAL_LLM_FALLBACK: ollama:qwen2.5:1.5b
    depends_on:
      ollama-setup:
        condition: service_completed_successfully

  worker:
    environment:
      LLM: ollama:qwen2.5:3b
      RERANK_LLM: ollama:qwen2.5:3b
      OLLAMA_BASE_URL: http://ollama:11434/v1
      TRANSCRIPTION_PROVIDER: whisper
      WHISPER_MODEL_SIZE: base
      WHISPER_FALLBACK_MODEL: tiny
      LOCAL_LLM_FALLBACK: ollama:qwen2.5:1.5b
    depends_on:
      ollama-setup:
        condition: service_completed_successfully

volumes:
  ollama_models:
